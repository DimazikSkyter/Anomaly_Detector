<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datasource Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
<h1>Datasource Table</h1>
<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>IP:Port</th>
        <th>Status</th>
    </tr>
    </thead>
    <tbody>
    {% for datasource in datasources %}
    <tr>
        <td>{{ datasource.name }}</td>
        <td>{{ datasource.ip_port }}</td>
        <td>{{ datasource.status }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
</body>
</html>
